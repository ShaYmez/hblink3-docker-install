services:
  hblink3:
    container_name: hblink
    volumes:
      - '/etc/hblink3/hblink.cfg:/hblink3/hblink.cfg'
      - '/var/log/hblink/hblink.log:/hblink3/hblink.log'
      - '/etc/hblink3/rules.py:/hblink3/rules.py'
      # Canonical alias JSON (talkgroup_ids.json is the single source of truth)
      - '/etc/hblink3/json/:/hblink3/json/'
    ports:
      # Master Ports (99 Masters)
      - '54000-54099:54000-54099/udp'
      # MMDVM & OBP Ports
      - '62030-62050:62030-62050/udp'
      # TCP Port for HBmonitor
      - '4321:4321/tcp'
    image: 'shaymez/hblink3:latest'
    restart: "unless-stopped"
    networks:
      app_net:
        ipv4_address: 172.16.238.10
    environment:
      - 'PARROT_ENABLE=1'

  hbmon:
    image: 'shaymez/hbmonv2:latest'
    container_name: hbmon
    restart: "unless-stopped"
    depends_on:
      - hblink3
    ports:
      - '9000:9000'
    volumes:
      - '/etc/hblink3/config.py:/hbmon/config.py:ro'
      - '/var/log/hbmon:/hbmon/log'
      # Same host dir as HBlink ./json — HBMon manager should write talkgroup_ids.json here
      - '/etc/hblink3/json:/hbmon/data'
      - '/etc/hblink3/json/templates/lastheard.html:/hbmon/templates/lastheard.html'
    networks:
      app_net:
        ipv4_address: 172.16.238.12

networks:
  app_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.238.0/24
          gateway: 172.16.238.1
