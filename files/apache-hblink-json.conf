# Canonical talkgroup list: /etc/hblink3/json/talkgroup_ids.json
# HBlink ./json and HBMon ./data are the same bind mount.
# Public endpoint: /json/talkgroup_ids.json

Alias /json/talkgroup_ids.json /etc/hblink3/json/talkgroup_ids.json

<Directory /etc/hblink3/json>
    Require all granted
    <IfModule mod_headers.c>
        Header set Access-Control-Allow-Origin "*"
        Header set Cache-Control "no-cache"
    </IfModule>
</Directory>
