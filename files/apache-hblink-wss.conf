# HBMon websocket over TLS. Browser uses wss://FQDN:9000 (hbmon.js).
# Backend is the hbmon container bound to 127.0.0.1:9001.
# Certificate paths are filled in by hblink-ssl.

Listen 9000

<IfModule mod_ssl.c>
<VirtualHost *:9000>
	ServerName __FQDN__
	SSLEngine on
	SSLCertificateFile /etc/letsencrypt/live/__FQDN__/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/__FQDN__/privkey.pem
	Include /etc/letsencrypt/options-ssl-apache.conf

	ProxyRequests Off
	ProxyPreserveHost On
	RequestHeader set X-Forwarded-Proto "https"

	ProxyPass / ws://127.0.0.1:9001/
	ProxyPassReverse / ws://127.0.0.1:9001/
</VirtualHost>
</IfModule>
